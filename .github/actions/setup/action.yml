name: Setup
description: Install pnpm, setup Node with pnpm cache, install dependencies. Caller must run actions/checkout first.
runs:
  using: composite
  steps:
    # pnpm version is read from package.json packageManager field.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
