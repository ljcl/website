name: Setup
description: Install pnpm, setup Node with pnpm cache, install dependencies. Caller must run actions/checkout first.
runs:
  using: composite
  steps:
    # pnpm version is read from package.json packageManager field.
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
