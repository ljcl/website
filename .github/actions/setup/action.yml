name: Setup
description: Install pnpm, setup Node with pnpm cache, install dependencies. Caller must run actions/checkout first.
runs:
  using: composite
  steps:
    # pnpm version is read from package.json packageManager field.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
